name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Shared checks from https://github.com/Naresh1401/github-cicd-workflows
  validate:
    name: Lint HTML and CSS
    uses: Naresh1401/github-cicd-workflows/.github/workflows/node-ci.yml@v2
    with:
      node-version: "20"

  repo-lint:
    name: Repository lint
    uses: Naresh1401/github-cicd-workflows/.github/workflows/repo-lint.yml@v1

  deploy:
    needs: [validate, repo-lint]
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
