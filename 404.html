<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<script>
// Match the theme the visitor picked on the main site
(function () {
  var theme;
  try { theme = localStorage.getItem('theme'); } catch (e) {}
  if (theme !== 'light' && theme !== 'dark') {
    theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<title>Page not found | Naresh Sampangi</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23141414'/><text x='32' y='42' font-family='Arial Black,Arial,sans-serif' font-size='26' font-weight='900' text-anchor='middle' fill='%23f2a900'>NS</text></svg>" type="image/svg+xml"/>
<!-- Absolute paths: GitHub Pages serves this page at whatever URL was missing, at any depth -->
<link rel="preload" href="/personal-website/fonts/archivo-variable-latin.woff2" as="font" type="font/woff2" crossorigin/>
<style>
  @font-face {
    font-family: 'Archivo';
    font-style: normal;
    font-weight: 100 900;
    font-stretch: 62% 125%;
    font-display: swap;
    src: url('/personal-website/fonts/archivo-variable-latin.woff2') format('woff2');
  }

  :root {
    --ground: #f2a900;
    --panel: #fcfcfa;
    --ink: #141414;
    --ink-2: #4d4a42;
    --rule: #141414;
    --accent: #141414;
    --on-accent: #fcfcfa;
    --title-ink: #141414;
    --focus: #141414;

    color-scheme: light;
  }

  :root[data-theme='dark'] {
    --ground: #121212;
    --panel: #1b1b1a;
    --ink: #efefea;
    --ink-2: #bebcb3;
    --rule: #efefea;
    --accent: #f2a900;
    --on-accent: #141414;
    --title-ink: #f2a900;
    --focus: #f2a900;

    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    display: grid;
    place-items: center;
    min-height: 100dvh;
    padding: 24px 16px;
    background: var(--ground);
    color: var(--ink);
    font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 1.0625rem;
    line-height: 1.55;
  }

  main { width: min(100%, 560px); padding: 22px 26px 26px; border: 3px solid var(--rule); background: var(--panel); }
  h1 { color: var(--title-ink); font-size: clamp(2.75rem, 10vw, 4.25rem); font-weight: 900; line-height: 0.9; letter-spacing: -0.04em; }
  .serving { margin-top: 14px; font-size: 1.25rem; font-weight: 800; line-height: 1.25; }
  .bar { height: 12px; margin: 14px 0 0; background: var(--rule); }

  .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-top: 4px;
    padding: 6px 0 8px;
    border-bottom: 1px solid var(--rule);
  }

  .row span { font-weight: 800; }
  .row strong { font-size: 3rem; font-weight: 900; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .note { margin-top: 12px; color: var(--ink-2); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }

  .btn {
    display: inline-flex;
    align-items: center;
    min-height: 48px;
    padding: 0 22px;
    border: 2px solid currentcolor;
    color: inherit;
    font-weight: 750;
    text-decoration: none;
    transition: background-color 0.15s;
  }

  .btn:hover { background: color-mix(in srgb, currentcolor 10%, transparent); }
  .btn-primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
  .btn-primary:hover { background: color-mix(in srgb, var(--accent) 84%, var(--panel)); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  ::selection { background: var(--title-ink); color: var(--panel); }
</style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p class="serving">This page doesn't exist.</p>
    <div class="bar" aria-hidden="true"></div>
    <p class="row"><span>Status</span><strong>404</strong></p>
    <p class="note">The link may be broken, or the page may have moved.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/personal-website/">Back to home</a>
      <a class="btn" href="/personal-website/#projects">View projects</a>
    </div>
  </main>
</body>
</html>
