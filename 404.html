<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<script>
// Match the theme the visitor picked on the main site
(function () {
  var theme;
  try { theme = localStorage.getItem('theme'); } catch (e) {}
  if (theme !== 'light' && theme !== 'dark') {
    theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<title>404 — Page Not Found | Naresh Sampangi</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2338bdf8'/><stop offset='.45' stop-color='%2360a5fa'/><stop offset='1' stop-color='%23a78bfa'/></linearGradient></defs><rect width='64' height='64' rx='16' fill='url(%23g)'/><text x='32' y='41' font-family='Arial Black,Arial,sans-serif' font-size='24' font-weight='900' text-anchor='middle' fill='%23070b16'>NS</text></svg>" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Syne:wght@800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #070b16;
    --text: #edf2fa;
    --text-2: #a9b6ca;
    --line: rgba(148, 163, 184, 0.22);
    --grid-line: rgba(148, 163, 184, 0.07);
    --grad: linear-gradient(110deg, #38bdf8 0%, #60a5fa 38%, #a78bfa 100%);
    --glow: rgba(96, 165, 250, 0.45);
    --on-accent: #050a14;

    color-scheme: dark;
  }

  :root[data-theme='light'] {
    --bg: #f6f8fc;
    --text: #0b1324;
    --text-2: #3d4a60;
    --line: rgba(15, 23, 42, 0.16);
    --grid-line: rgba(15, 23, 42, 0.05);
    --grad: linear-gradient(110deg, #0284c7 0%, #2563eb 40%, #7c3aed 100%);
    --glow: rgba(37, 99, 235, 0.3);
    --on-accent: #ffffff;

    color-scheme: light;
  }

  * { box-sizing: border-box; margin: 0; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(60% 50% at 50% 35%, rgba(96, 165, 250, 0.16), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
    text-align: center;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 40%, #000 20%, transparent 75%);
    mask-image: radial-gradient(ellipse 60% 55% at 50% 40%, #000 20%, transparent 75%);
  }

  .code {
    font-family: 'Syne', sans-serif;
    font-size: clamp(6rem, 24vw, 12rem);
    font-weight: 800;
    line-height: 0.9;
    letter-spacing: -0.05em;
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  h1 { margin: 20px 0 10px; font-size: clamp(1.3rem, 4vw, 1.75rem); font-weight: 600; letter-spacing: -0.02em; }
  p { margin-bottom: 32px; color: var(--text-2); }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }

  .btn {
    display: inline-flex;
    align-items: center;
    height: 46px;
    padding: 0 22px;
    border: 1px solid transparent;
    border-radius: 999px;
    font-size: 0.92rem;
    font-weight: 500;
    text-decoration: none;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-primary { background: var(--grad); color: var(--on-accent); box-shadow: 0 10px 30px -12px var(--glow); }
  .btn-ghost { border-color: var(--line); color: var(--text); }
  .btn:focus-visible { outline: 2px solid #60a5fa; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>This page doesn't exist.</h1>
    <p>The link may be broken, or the page may have moved.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/personal-website/">Back to home</a>
      <a class="btn btn-ghost" href="/personal-website/#projects">View projects</a>
    </div>
  </main>
</body>
</html>
